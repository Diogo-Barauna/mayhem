<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'" />
  <title>Overlay</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; user-select: none; }
    .badge {
      position: absolute;
      transform: translate(-50%, -50%); /* centralizado na borda de cima da carta */
      display: flex; align-items: center; gap: 8px;
      padding: 6px 12px 6px 6px;
      border-radius: 10px;
      background: rgba(12, 14, 20, .88);
      border: 2px solid #555;
      color: #fff;
      white-space: nowrap;
      box-shadow: 0 4px 18px rgba(0,0,0,.6);
      font-size: 15px;
    }
    .badge.best { border-color: #ff7a45; box-shadow: 0 0 22px rgba(255,122,69,.75); }
    .tier { width: 30px; height: 30px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; color: #111; }
    .S { background: #ff7a45; } .A { background: #f2c94c; } .B { background: #6fcf97; } .C { background: #56a8e8; } .D, .q { background: #8a91a6; }
    .label { font-weight: 700; }
    .sub { font-size: 12px; opacity: .75; }
    .panel {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(12, 14, 20, .85); color: #e6e8ef; border: 1px solid #c8aa6e; border-radius: 8px;
      padding: 6px 14px; font-size: 13px;
    }
    .panel b { color: #c8aa6e; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="overlay.js"></script>
</body>
</html>
